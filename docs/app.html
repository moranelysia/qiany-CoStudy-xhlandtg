<!doctype html>
<html lang="zh-CN" data-platform="web">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>伴学 CoStudy（Web 体验版）</title>
    <link rel="icon" href="./media/costudy-icon.png" type="image/png" sizes="256x256" />
    <style>
      /* 窗口透明：窗口后面就是桌面（Windows 上是系统亚克力）。
         具体的玻璃样式全部在 styles/ 里，这里只保证外壳不铺底色。 */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: linear-gradient(160deg,#eef4fb 0%,#e6eef8 45%,#e9f1fa 100%);
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
          "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
        font-synthesis-weight: none;
        overflow-x: clip;
      }

      #stage {
        min-height: 100vh;
        overflow-x: clip;
      }

      /* 提示条（原型里是 window.__toast，这里给它一个落点） */
      #toasts {
        position: fixed;
        right: 20px;
        bottom: 28px;
        display: grid;
        gap: 8px;
        z-index: 9999;
        pointer-events: none;
      }
      #toasts .toast {
        padding: 9px 14px;
        border-radius: 999px;
        background: rgba(28, 28, 32, 0.86);
        -webkit-backdrop-filter: blur(16px) saturate(180%);
        backdrop-filter: blur(16px) saturate(180%);
        color: #fff;
        font-size: 13px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.24);
      }
    </style>
    <style>
      /* ---- Web 版适配 ---- */
      /* 桌面版的三个自绘窗口按钮在浏览器里没有意义，直接隐藏 */
      .wincontrols { display: none !important; }
      /* 网页没有窗口拖拽区，留白也收窄一点 */
      body { padding-top: 0 !important; }
      .titlebar-drag { display: none !important; }
      #web-badge { text-decoration: none; border-bottom: 0;
        position: fixed; left: 14px; bottom: 14px; z-index: 9998;
        padding: 6px 12px; border-radius: 999px;
        background: rgba(255,255,255,.82); border: 1px solid rgba(120,148,178,.28);
        color: #5a6a7a; font-size: 11px; letter-spacing: .02em;
        box-shadow: 0 4px 14px rgba(96,135,180,.18);
        cursor: help; user-select: none;
      }
      #stage .v-comp .learn-thread { align-content: start; }
      #stage .v-home .hm-card, #stage .v-home .hm-stat {
        background: #fff;
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }
      [data-platform="web"] .input,
      [data-platform="web"] .textarea,
      [data-platform="web"] .compiled-text {
        -webkit-backdrop-filter: none !important;
        backdrop-filter: none !important;
      }
      #stage .v-comp .learn-bubble a { display: inline-block; margin-top: 4px; }
      #stage .studio-editor .web-studio-jumps { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
      #stage .studio-editor .web-model-preview { display: grid; justify-items: start; gap: 7px; margin-top: 12px; }
      #stage .studio-editor [data-preview-source] { margin-bottom: 5px; }
      #stage .v-studio .rail-foot [data-profile] { display: none; }
      #stage .v-home [hidden] { display: none !important; }
      #stage .v-home .hm-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }

      @media (max-width: 760px) {
        #stage .app.studio-editor {
          grid-template-columns: minmax(0, 1fr);
          gap: 16px;
          padding: 66px 14px 28px;
        }
        #stage .app.v-plugins { padding: 86px 14px 20px; }
        #stage .studio-editor > * { min-width: 0; }
        #stage .studio-editor > .hero { padding: 2px 0 6px; }
        #stage .studio-editor > .hero::before { display: none; }
        #stage .studio-editor > .rail,
        #stage .studio-editor > .preview { position: static; width: 100%; min-width: 0; }
        #stage .studio-editor > main,
        #stage .studio-editor > .preview { scroll-margin-top: 90px; }
        #stage .studio-editor .studio-identity-fields { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
        #stage .studio-editor .panel-head { flex-wrap: wrap; gap: 6px; }
        #stage .studio-editor .ce-actions { flex-wrap: wrap; }
        #stage .studio-editor .segmented { flex-wrap: wrap; overflow: visible; }
        #stage .studio-editor .segmented-item { white-space: nowrap; }
        #stage .studio-editor .compiled-text { overflow-wrap: anywhere; }
      }

      @media (max-width: 600px) {
        body .proto-picker { top: 8px; width: max-content; }
        .proto-picker .proto-picker-item { white-space: nowrap; padding-inline: 9px; }
        .proto-picker .proto-picker-status,
        .proto-picker .proto-picker-divider { display: none; }
        #web-badge { top: 51px; right: 12px; bottom: auto; left: auto; }

        #stage .app.v-comp:has(.learn-wrap) {
          height: 100dvh;
          padding: 88px 12px 12px;
        }
        #stage .v-comp .learn-top {
          flex-wrap: wrap;
          gap: 6px 8px;
          padding-right: 0;
          margin-bottom: 10px;
        }
        #stage .v-comp .learn-top > div:nth-child(2) {
          flex: 1 0 calc(100% - 56px) !important;
          min-width: 0;
        }
        #stage .v-comp .learn-top h1 { overflow-wrap: anywhere; }
        #stage .v-comp .learn-top button { white-space: nowrap; }
        #stage .v-comp .learn-bubble { overflow-wrap: anywhere; }
        #stage .v-comp .learn-thread { padding-bottom: 16px; margin-bottom: 8px; }
        #stage .v-comp .dock {
          display: grid;
          grid-template-columns: repeat(4, minmax(0, 1fr));
          justify-items: center;
          bottom: 0;
        }
        #stage .v-comp .dock > :not(.input, .send) {
          grid-row: 2;
          max-width: 100%;
          margin-left: 0;
        }
        #stage .v-comp .dock .input {
          grid-area: 1 / 1 / 2 / -2;
          width: 100%;
          min-width: 0;
          font-size: 16px;
        }
        #stage .v-comp .dock .send { grid-area: 1 / -2 / 2 / -1; }
        #stage .v-comp .math-pad {
          bottom: 104px;
          right: 12px;
          max-width: calc(100% - 24px);
          max-height: 55dvh;
          overflow: auto;
        }
        #stage .v-comp .mp-key { min-width: 0; padding-inline: 2px; }
      }
    </style>
    <link rel="stylesheet" id="boot-css" href="./assets/index-BTYX4-Em.css" />
  </head>
  <body>
    <div id="stage"></div>
    <div id="toasts" aria-live="polite"></div>

    <!-- 首页入口：在灵动岛左侧，独立一个胶囊（位置由 main.ts 实测后摆放） -->
    <button class="home-pill" type="button" data-home-open aria-label="首页">首页</button>

    <!-- 变体选择器：Studio / Wizard / Companion
         （原型里的评审工具，移植时丢过一次，现在搬进来）
         键盘：1/2/3 切换，←/→ 循环，R 重放 -->
    <nav class="proto-picker" aria-label="界面变体">
      <span class="proto-picker-highlight" aria-hidden="true"></span>
      <!-- 不要加 title：这几个按钮悬停一会儿会弹出浏览器的原生提示（黑色小框，
           内容还是英文 Studio / Wizard / Companion），用户明确要求去掉。 -->
      <button class="proto-picker-item" data-active aria-current="true">角色工坊</button>
      <button class="proto-picker-item">插件</button>
      <button class="proto-picker-item">伴学</button>
      <span class="proto-picker-divider" aria-hidden="true"></span>

      <!-- 展开后显示当前状态：点当前变体展开/收起（灵动岛） -->
      <span class="proto-picker-status" aria-live="polite">
        <span class="proto-picker-status-title"></span>
        <span class="proto-picker-status-sub"></span>
      </span>
    </nav>
      <a id="web-badge" href="./index.html" title="返回介绍页；数据保存在本机浏览器（localStorage）；代码执行 / 画图 / 联网检索只在桌面版可用">← 介绍页 · Web 体验版</a>
    <section id="boot-error" role="status" hidden style="padding:24px">
      <p>网页资源加载失败，请重新加载。</p>
      <button type="button" id="boot-retry">重新加载</button>
      <a href="./trial.html">试学一道题</a>
    </section>
    <script>
      (function () {
        var fallback = {
          entry: 'assets/index-e7S-xtfR.js',
          css: 'assets/index-BTYX4-Em.css',
          bridge: 'bridge.js',
          v: '20261127-final-review'
        }
        function asset(path, v) {
          return './' + path + '?v=' + encodeURIComponent(v)
        }
        function script(path, v, type) {
          return new Promise(function (resolve, reject) {
            var node = document.createElement('script')
            if (type) node.type = type
            node.src = asset(path, v)
            node.onload = resolve
            node.onerror = reject
            document.body.appendChild(node)
          })
        }
        async function boot() {
          var build = fallback
          try {
            var response = await fetch('./build.json', { cache: 'no-store', signal: AbortSignal.timeout(5000) })
            if (response.ok) {
              var manifest = await response.json()
              if (manifest && manifest.entry && manifest.css && manifest.bridge && manifest.v) build = manifest
            }
          } catch (_) { /* 使用页面内同一版本的资源清单 */ }
          document.getElementById('boot-css').href = asset(build.css, build.v)
          await script(build.bridge, build.v)
          if (!window.costudy) throw new Error('缺少网页版接口')
          await script(build.entry, build.v, 'module')
        }
        document.getElementById('boot-retry').addEventListener('click', function () { location.reload() })
        boot().catch(function () { document.getElementById('boot-error').hidden = false })
      })()
    </script>
  </body>
</html>
