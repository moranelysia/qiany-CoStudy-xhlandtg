<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Costudy · UI 原型（三方向对比）</title>
<style>
/* ==========================================================
   Costudy · UI Prototype — design tokens
   来源：emilkowalski/skills（MIT）
   规则：不动画化 >300ms；不用 ease-in；不从 scale(0) 起；只动 transform/opacity
   ========================================================== */
:root {
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);

  --dur-press: 160ms;
  --dur-tip: 150ms;
  --dur-pop: 200ms;
  --dur-modal: 320ms;

  --bg: #fbfaf9;
  --panel: #ffffff;
  --ink: #1c1b1a;
  --ink-2: #57534e;
  --ink-3: #8a857f;
  --line: #e7e4e0;
  --line-strong: #d6d2cd;
  --accent: #b45309;
  --accent-soft: #fdf5ed;
  --accent-line: #f2ddc4;
  --ok: #15803d;
  --warn: #b45309;

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 22px;

  --shadow-1: 0 1px 2px rgba(28, 27, 26, 0.05), 0 1px 3px rgba(28, 27, 26, 0.04);
  --shadow-2: 0 2px 6px rgba(28, 27, 26, 0.06), 0 8px 24px rgba(28, 27, 26, 0.07);
  --shadow-pop: 0 0 0 1px rgba(28, 27, 26, 0.06), 0 4px 12px rgba(28, 27, 26, 0.08),
    0 16px 40px rgba(28, 27, 26, 0.1);

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC",
    "Hiragino Sans GB", sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
  line-height: 1.55;
}

button {
  font-family: inherit;
}

/* ---------- stage ---------- */
#stage {
  min-height: 100vh;
  padding: 28px 28px 96px;
}

.app {
  max-width: 1180px;
  margin: 0 auto;
}

/* ---------- shared atoms ---------- */
.card {
  background: var(--panel);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-1);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 34px;
  padding: 0 14px;
  border-radius: 9px;
  border: 1px solid var(--line-strong);
  background: var(--panel);
  color: var(--ink);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition:
    transform var(--dur-press) var(--ease-out),
    background-color var(--dur-tip) ease,
    border-color var(--dur-tip) ease;
}
.btn:hover {
  background: #f7f5f3;
}
.btn:active {
  transform: scale(0.97);
}
.btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.btn.primary {
  background: var(--ink);
  border-color: var(--ink);
  color: #fff;
}
.btn.primary:hover {
  background: #33312f;
}
.btn.ghost {
  border-color: transparent;
  background: transparent;
  color: var(--ink-2);
}
.btn.ghost:hover {
  background: #f2efec;
  color: var(--ink);
}
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.btn:disabled:active {
  transform: none;
}

.tag {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 8px;
  border-radius: 6px;
  background: var(--accent-soft);
  color: var(--accent);
  border: 1px solid var(--accent-line);
  font-size: 11.5px;
  font-weight: 500;
}

.muted {
  color: var(--ink-3);
}
.small {
  font-size: 12px;
}

h1,
h2,
h3,
h4 {
  margin: 0;
  font-weight: 600;
  letter-spacing: -0.011em;
}

/* ---------- range slider (shared, but styled per variant via --thumb) ---------- */
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 20px;
  background: transparent;
  cursor: pointer;
  margin: 0;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 4px;
  border-radius: 999px;
  /* --pct is set inline on the <input>, so the track reads it from there */
  background: linear-gradient(
    to right,
    var(--track-fill, var(--ink)) 0%,
    var(--track-fill, var(--ink)) var(--pct, 50%),
    var(--line) var(--pct, 50%),
    var(--line) 100%
  );
}
input[type="range"] {
  --pct: 50%;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 16px;
  height: 16px;
  margin-top: -6px;
  border-radius: 50%;
  background: #fff;
  border: 1.5px solid var(--ink);
  box-shadow: var(--shadow-1);
  transition: transform var(--dur-press) var(--ease-out);
}
input[type="range"]:hover::-webkit-slider-thumb {
  transform: scale(1.1);
}
input[type="range"]:active::-webkit-slider-thumb {
  transform: scale(1.15);
}
input[type="range"]:focus-visible {
  outline: none;
}
input[type="range"]:focus-visible::-webkit-slider-thumb {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ---------- text inputs ---------- */
.input,
.textarea {
  width: 100%;
  border: 1px solid var(--line-strong);
  border-radius: 9px;
  padding: 8px 11px;
  font-family: inherit;
  font-size: 13.5px;
  color: var(--ink);
  background: #fff;
  transition: border-color var(--dur-tip) ease, box-shadow var(--dur-tip) ease;
}
.input:focus,
.textarea:focus {
  outline: none;
  border-color: var(--ink-3);
  box-shadow: 0 0 0 3px rgba(28, 27, 26, 0.06);
}
.textarea {
  resize: vertical;
  min-height: 72px;
  line-height: 1.6;
}

/* ---------- blur bridge: preview content changing ---------- */
.blur-bridge {
  transition: filter var(--dur-pop) ease, opacity var(--dur-pop) ease;
}
.blur-bridge.is-updating {
  filter: blur(2px);
  opacity: 0.7;
}

/* ---------- entrance (no JS, no scale(0)) ---------- */
@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(6px) scale(0.99);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}
.rise {
  animation: rise var(--dur-modal) var(--ease-out) both;
}

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ---------- picker (verbatim from PICKER.md) ---------- */
.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}
.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}
@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight {
    transition: none;
  }
}
.proto-picker-item {
  position: relative;
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}
.proto-picker-item:hover {
  color: rgba(255, 255, 255, 0.85);
}
.proto-picker-item:active {
  transform: scale(0.97);
}
.proto-picker-item:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.4);
  outline-offset: 2px;
}
.proto-picker-item[data-active] {
  color: #fff;
}
.proto-picker-divider {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: rgba(255, 255, 255, 0.12);
}
.proto-picker-replay {
  padding: 0 10px;
  font-size: 14px;
}
.proto-picker[data-position="top"] {
  bottom: auto;
  top: 24px;
}

</style>

</style>

/* ---------- shared: components ---------- */
/* ==========================================================

/** escape for text interpolation */
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/**
 * A personality slider row.
 * data-key carries the dimension so the variant can bind generically.
 */
function sliderRow(dim, opts = {}) {
  const compact = opts.compact ? ' is-compact' : '';
  const value = dim.value;
  const label = dim.label ?? dim.left;
  return `
    <div class="dim${compact}" data-dim="${esc(dim.key)}">
      <div class="dim-head">
        <span class="dim-name">${esc(label)}</span>
        <span class="dim-poles small muted">${esc(dim.left)} ↔ ${esc(dim.right)}</span>
        <span class="dim-val" data-val>${value}</span>
      </div>
      <input type="range" min="0" max="100" value="${value}"
             aria-label="${esc(label)}"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="${value}"
             style="--pct:${value}%" data-slider />
      ${opts.hint && dim.hint ? `<p class="dim-hint small muted">${esc(dim.hint)}</p>` : ''}
    </div>`;
}

/** iOS-style switch */
function toggleRow(item) {
  return `
    <label class="switch-row" data-toggle="${esc(item.key)}">
      <span class="switch-text">
        <span class="switch-label">${esc(item.label)}</span>
        ${item.hint ? `<span class="switch-hint small muted">${esc(item.hint)}</span>` : ''}
      </span>
      <input type="checkbox" ${item.on ? 'checked' : ''} data-switch />
      <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
    </label>`;
}

/** segmented control */
function segmented(name, options, active, ariaLabel) {
  return `
    <div class="segmented" role="radiogroup" aria-label="${esc(ariaLabel)}" data-segmented="${esc(name)}">
      ${options
        .map(
          (o) => `<button type="button" class="segmented-item${o === active ? ' is-on' : ''}"
                    role="radio" aria-checked="${o === active}" data-value="${esc(o)}">${esc(o)}</button>`
        )
        .join('')}
    </div>`;
}

/** avatar bubble — first grapheme of the name, or emoji */
function avatar(name, emoji, size = 40) {
  const initial = (emoji || [...(name || '?')][0] || '?').toString();
  return `<span class="avatar" style="--sz:${size}px" aria-hidden="true">${esc(initial)}</span>`;
}

/** bind a slider row: updates fill %, aria, and the number readout */
function bindSlider(root, key, onChange) {
  const row = root.querySelector(`[data-dim="${key}"]`);
  if (!row) return;
  const input = row.querySelector('[data-slider]');
  const val = row.querySelector('[data-val]');
  input.addEventListener('input', () => {
    const v = Number(input.value);
    input.style.setProperty('--pct', v + '%');
    input.setAttribute('aria-valuenow', String(v));
    val.textContent = String(v);
    onChange?.(key, v);
  });
}

/** generic mount helper: clears the node then renders */
function mountHTML(node, html) {
  node.innerHTML = html;
}

/** add the blur-bridge transition to an element while its content changes */
function blurSwap(el, mutate) {
  el.classList.add('is-updating');
  window.setTimeout(() => {
    mutate();
    // next frame removes the blur so the new content fades in
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('is-updating')));
  }, 170);
}

/** the questions the preview answers */

/* ---------- reply selection: template preset + live slider influence ---------- */
function pickReply() {
  const preset = currentPreset();
  const d = Object.fromEntries(state.dims.map((x) => [x.key, x.value]));
  const pool = REPLIES[state.activeCard] || REPLIES.senior;
  let text = pool[state.askIdx % pool.length];

  // make slider changes visibly affect the reply (so the preview is honest)
  if (d.verbosity < 30 && text.length > 90) {
    text = text.split(/[。？！]/)[0] + '。';
  }
  if (d.warmth > 80 && !/[！~～]/.test(text)) {
    text = text.replace(/。$/, '。慢慢来，不急。');
  }
  if (d.strict > 75 && !/^(先|别|不)/.test(text)) {
    text = '先把思路写下来。' + text;
  }
  if (d.formality > 70) {
    text = text.replace(/别急，/g, '不必着急，').replace(/诶/g, '');
  }
  return text;
}

    if (!btn) return;
    applyTemplate(btn.dataset.template);

    const t = TEMPLATES.find((x) => x.id === id);
    if (!t) return;
    state.activeCard = id;
    state.name = t.name;
    state.emoji = t.emoji;
    const preset = PRESETS[id];
    if (preset) {
      state.dims.forEach((d) => {
        if (preset[d.key] != null) d.value = preset[d.key];
      });

      const row = root.querySelector(`[data-dim="${d.key}"]`);
      const input = row.querySelector('[data-slider]');

      input.setAttribute('aria-valuenow', String(d.value));
      row.querySelector('[data-val]').textContent = String(d.value);
    });
    root.querySelector('[data-in="name"]').value = state.name;
    root.querySelectorAll('[data-card]').forEach((el) => el.classList.toggle('is-on', el.dataset.card === id));
    paintAll();
    blurSwap(root.querySelector('[data-reply]'), () => {
      root.querySelector('[data-replytext]').textContent = pickReply();
      root.querySelector('[data-compiled]').textContent = compile();
    });
  }

  // identity inputs
  root.querySelectorAll('[data-in]').forEach((el) => {
    el.addEventListener('input', () => {
      state[el.dataset.in] = el.value;
      root.querySelector('[data-cardtitle]').textContent = state.name;
      root.querySelector('[data-replyname]').textContent = state.name;

  // segmented
  root.querySelectorAll('[data-segmented]').forEach((seg) => {
    seg.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-value]');
      if (!btn) return;
      const name = seg.dataset.segmented;
      seg.querySelectorAll('[data-value]').forEach((b) => {
        const on = b === btn;

        b.setAttribute('aria-checked', String(on));
      });
      if (name === 'stage') state.stage = btn.dataset.value;
      if (name === 'exercise') state.exercise = btn.dataset.value;
      if (name === 'error') state.errorMode = btn.dataset.value;
      refreshPreview();
    });
  });

  // toggles
  root.querySelectorAll('[data-toggle]').forEach((row) => {
    const input = row.querySelector('[data-switch]');
    input.addEventListener('change', () => {
      const t = state.teaching.find((x) => x.key === row.dataset.toggle);
      if (t) t.on = input.checked;
      refreshPreview();
    });
  });

  // ask chips
  asksEl.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-ask-idx]');
    if (!btn) return;
    state.askIdx = Number(btn.dataset.askIdx);
    asksEl.querySelectorAll('[data-ask-idx]').forEach((b) => b.classList.toggle('is-on', b === btn));
    root.querySelector('[data-ask]').textContent = PREVIEW_PROMPTS[state.askIdx];
    refreshPreview();
  });

  // neutral reset
  root.querySelector('[data-neutral]').addEventListener('click', () => {
    state.dims.forEach((d) => {
      d.value = 50;
      const row = root.querySelector(`[data-dim="${d.key}"]`);
      const input = row.querySelector('[data-slider]');
      input.value = '50';
      input.style.setProperty('--pct', '50%');
      input.setAttribute('aria-valuenow', '50');
      row.querySelector('[data-val]').textContent = '50';
    });
    refreshPreview();
  });

  // save -> toast + state indication
  root.querySelector('[data-save]').addEventListener('click', (e) => {
    const btn = e.currentTarget;
    const original = btn.textContent;
    btn.textContent = '已保存 ✓';
    window.setTimeout(() => {
      btn.textContent = original;
    }, 1400);
    window.__toast?.('「' + state.name + '」已保存');
  });

  root.querySelector('[data-recompile]').addEventListener('click', refreshPreview);
  root.querySelector('[data-ai]').addEventListener('click', () => window.__toast?.('AI 写卡：给三个关键词就能生成整张卡'));
  root.querySelector('[data-new]').addEventListener('click', () => window.__toast?.('新建角色卡'));
  root.querySelector('[data-discard]').addEventListener('click', () => window.__toast?.('已放弃本次修改'));
  root.querySelector('[data-golearn]').addEventListener('click', () => {
    state.view = 'learn';
    paint(root);
  });

  paintAll();
}








return { mount };

  errorMode: '引导自检',
  dims: JSON.parse(JSON.stringify(DIMS)),
  teaching: JSON.parse(JSON.stringify(TEACHING)),
  learnMode: 'plan',
};

function applyPreset(id) {
  const t = TEMPLATES.find((x) => x.id === id);
  if (!t) return;
  state.templateId = id;
  state.name = t.name;
  state.emoji = t.emoji;
  const p = PRESETS[id] || {};
  state.dims.forEach((d) => {
    if (p[d.key] != null) d.value = p[d.key];
  });
}

function renderSteps() {
  return STEPS.map(
    (s, i) => `
    <div class="step${i < step ? ' is-done' : ''}${i === step ? ' is-now' : ''}">
      <span class="step-dot">${i < step ? '✓' : i + 1}</span>
      <span>
        <span class="step-label">${esc(s.t)}</span>
        <span class="step-sub" style="display:block">${esc(s.s)}</span>
      </span>
      <span class="step-line"></span>
    </div>`
  ).join('');
}

function stepBody() {
  if (step === 0) {
    return `
      <div class="tpl-grid">
        ${TEMPLATES.slice(0, 6)
          .map(
            (t) => `
          <button class="tpl${t.id === state.templateId ? ' is-on' : ''}" data-tpl="${t.id}">
            <div class="tpl-emoji">${t.emoji}</div>
            <div class="tpl-name">${esc(t.name)}</div>
            <div class="tpl-line">${esc(t.line)}</div>
          </button>`
          )
          .join('')}
      </div>
      <div style="margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <label><span class="small muted">角色名</span><input class="input" data-in="name" value="${esc(state.name)}" /></label>
        <label><span class="small muted">怎么称呼你</span><input class="input" data-in="nickname" value="${esc(state.nickname)}" /></label>
      </div>`;
  }
  if (step === 1) {
    return `<div class="dims2">${state.dims.map((d) => sliderRow(d)).join('')}</div>`;
  }
  if (step === 2) {
    return `
      <div style="display:grid;gap:14px">
        <div class="dim" data-dim="explain">
          <div class="dim-head">
            <span class="dim-name">讲解比例</span>
            <span class="dim-poles small muted">纯提问 ↔ 纯讲解</span>
            <span class="dim-val" data-val>38</span>
          </div>
          <input type="range" min="0" max="100" value="38" style="--pct:38%" data-slider aria-label="讲解比例" aria-valuenow="38" />
        </div>
        <div style="display:grid;grid-template-columns:100px 1fr;gap:10px;align-items:center">
          <span class="small muted">学段</span><div data-stage></div>
        </div>
        <div style="display:grid;grid-template-columns:100px 1fr;gap:10px;align-items:center">
          <span class="small muted">出题频率</span><div data-exercise></div>
        </div>
        <div style="display:grid;grid-template-columns:100px 1fr;gap:10px;align-items:center">
          <span class="small muted">错误处理</span><div data-errormode></div>
        </div>
        <div style="border-top:1px solid var(--line);margin-top:4px;padding-top:8px" data-toggles>
          ${state.teaching.filter((t) => t.label).map(toggleRow).join('')}
        </div>
      </div>`;
  }
  return `
    <div class="review-card">
      <dl class="kv" style="margin:0">
        <dt>角色</dt><dd>${esc(state.emoji)} ${esc(state.name)}</dd>
        <dt>称呼你</dt><dd>${esc(state.nickname)}</dd>
        <dt>口头禅</dt><dd>${esc(state.catchphrase)}</dd>
        <dt>学段</dt><dd>${esc(state.stage)}</dd>
        <dt>教法</dt><dd>讲解 ${state.teaching.find((x) => x.key === 'explain').value}% · 练习${esc(state.exercise)} · ${esc(state.errorMode)}</dd>
        <dt>开关</dt><dd>${state.teaching.filter((t) => t.label && t.on).map((t) => esc(t.label)).join('、') || '全部关闭'}</dd>
      </dl>
    </div>
    <p class="small muted" style="margin:12px 0 0">
      保存后，这个角色会有自己独立的记忆与画像，跟其他角色互不干扰。
    </p>`;
}

/* ---- learning surface (plan-first) ---- */
function learnSurface(root) {
  const pct = (v) => Math.round(v * 100);
  root.innerHTML = `
  <div class="app v-wiz">
    <aside class="steps">
      ${renderSteps()}
      <button class="btn ghost" style="margin-top:14px;height:28px;font-size:12px" data-back>← 返回角色</button>
    </aside>
    <main class="wiz-main">
      <div class="learn-head">
        ${avatar(state.name, state.emoji, 38)}
        <div style="flex:1">

      </div>

      <div class="learn">

          <div class="goal">

            <div class="goal-t">${esc(LESSON.goal)}</div>
          </div>

          <section class="card" style="padding:6px 18px 12px">
            <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0 4px">
              <span style="font-size:13px;font-weight:600">知识点进度</span>
              <span class="small muted">4 个点 · 已完成 1 个</span>
            </div>
            <div class="kp-list">
              ${LESSON.points
                .map(
                  (k, i) => `
                <div class="kp ${k.state === 'done' ? 'is-done' : k.state === 'doing' ? 'is-doing' : ''}">
                  <span class="kp-mark">${k.state === 'done' ? '✓' : i + 1}</span>
                  <span>
                    <span class="kp-name">${esc(k.name)}</span>

                    }</span>

                    <span class="mastery-num">${pct(k.mastery)}%</span>

                )
                .join('')}
            </div>
          </section>

          <div class="start-teach">
            <button class="btn primary" data-start>从「${esc(LESSON.points[1].name)}」开始</button>

          </div>
        </div>

        <aside>
          <div class="side-card card">

            ${LESSON.review
              .map(
                (r) => `<div class="side-item"><b>${esc(r.text)}</b><span class="pill-due">${esc(r.due)}</span>
                  <div class="why">因为上次在「${esc(r.point)}」卡住过</div></div>`
              )
              .join('')}

          <div class="side-card card">
            <div class="side-title">你的高频错误</div>
            ${LESSON.errors
              .map(
                (e) => `<div class="side-item"><b>${esc(e.text)}</b>
                  <div class="why">${esc(e.point)} · ${esc(e.when)} · 出现 ${e.repeat} 次</div></div>`
              )

      if (b.hasAttribute('data-back')) {
        state.learnMode = 'wizard';
        render(root);
        return;
      }
      window.__toast?.(b.textContent.trim());
    })
  );
}

function render(root) {
  if (state.learnMode === 'plan') {
    learnSurface(root);
    return;
  }

  const canNext = step < 3;
  const body = stepBody();

  root.innerHTML = `
  <div class="app v-wiz">
    <aside class="steps">
      ${renderSteps()}
      <button class="btn ghost" style="margin-top:14px;height:28px;font-size:12px" data-preview-learn>预览学习界面 →</button>
    </aside>
    <main class="wiz-main">
      <div class="wiz-head">
        <div class="wiz-kicker">新建角色 · 第 ${step + 1} / 4 步</div>
        <h1 class="wiz-title">${esc(STEPS[step].t)}</h1>
        <p class="wiz-sub">${esc(STEPS[step].s)}</p>
      </div>
      <section class="card wiz-body blur-bridge" data-wizbody>${body}</section>
      <div class="wiz-foot">
        <button class="btn ghost" data-prev ${step === 0 ? 'disabled' : ''}>← 上一步</button>
        <span style="flex:1"></span>
        ${canNext ? '<button class="btn primary" data-next>下一步 →</button>' : '<button class="btn primary" data-done>保存并开始学习</button>'}
      </div>
    </main>
  </div>`;

  // bind step-specific controls
  if (step === 0) {
    root.querySelectorAll('[data-tpl]').forEach((btn) =>
      btn.addEventListener('click', () => {
        applyPreset(btn.dataset.tpl);
        render(root);
      })
    );
    root.querySelectorAll('[data-in]').forEach((el) =>
      el.addEventListener('input', () => {
        state[el.dataset.in] = el.value;
      })
    );
  }
  if (step === 1) {
    state.dims.forEach((d) => {
      bindSlider(root, d.key, (k, v) => {
        const t = state.dims.find((x) => x.key === k);
        if (t) t.value = v;
      });
    });
  }
  if (step === 2) {
    const exp = root.querySelector('[data-dim="explain"] [data-slider]');
    const expVal = root.querySelector('[data-dim="explain"] [data-val]');
    exp.addEventListener('input', () => {
      const v = Number(exp.value);
      exp.style.setProperty('--pct', v + '%');
      exp.setAttribute('aria-valuenow', String(v));
      expVal.textContent = String(v);
      state.teaching.find((x) => x.key === 'explain').value = v;
    });
    root.querySelector('[data-stage]').innerHTML = segmented('stage', STAGE_OPTIONS, state.stage, '学段');
    root.querySelector('[data-exercise]').innerHTML = segmented('exercise', EXERCISE_OPTIONS, state.exercise, '出题频率');
    root.querySelector('[data-errormode]').innerHTML = segmented('error', ERROR_OPTIONS, state.errorMode, '错误处理');
    root.querySelectorAll('[data-segmented]').forEach((seg) => {
      seg.addEventListener('click', (e) => {
        const b = e.target.closest('[data-value]');
        if (!b) return;
        seg.querySelectorAll('[data-value]').forEach((x) => {
          x.classList.toggle('is-on', x === b);
          x.setAttribute('aria-checked', String(x === b));
        });
        const n = seg.dataset.segmented;
        if (n === 'stage') state.stage = b.dataset.value;
        if (n === 'exercise') state.exercise = b.dataset.value;
        if (n === 'error') state.errorMode = b.dataset.value;
      });
    });
    root.querySelectorAll('[data-toggle]').forEach((row) => {
      const input = row.querySelector('[data-switch]');
      input.addEventListener('change', () => {
        const t = state.teaching.find((x) => x.key === row.dataset.toggle);
        if (t) t.on = input.checked;
      });
    });
  }

  root.querySelector('[data-prev]')?.addEventListener('click', () => {
    if (step === 0) return;
    blurSwap(root.querySelector('[data-wizbody]'), () => {
      step -= 1;
      render(root);
    });
  });
  root.querySelector('[data-next]')?.addEventListener('click', () => {
    blurSwap(root.querySelector('[data-wizbody]'), () => {
      step += 1;
      render(root);
    });
  });
  root.querySelector('[data-done]')?.addEventListener('click', () => {
    window.__toast?.(`「${state.name}」已保存，开始学习`);
    state.learnMode = 'plan';
    render(root);
  });
  root.querySelector('[data-preview-learn]')?.addEventListener('click', () => {
    state.learnMode = 'plan';
    render(root);
  });
}

function mount(root) {
  const styleEl = document.createElement('style');
  styleEl.textContent = STYLE;
  document.head.appendChild(styleEl);

  step = 0;
  state.learnMode = 'wizard';
  applyPreset('senior');
  render(root);
}


return { mount };
})();

function applyTemplate(id) {
  const t = TEMPLATES.find((x) => x.id === id);

  const p = PRESETS[id] || {};

function inferTemplate(text) {

  return 'senior';

  const bands = [
    ['热情', d.warmth], ['正式', d.formality], ['幽默', d.humor], ['耐心', d.patience],
    ['严格', d.strict], ['主动', d.proactive], ['鼓励', d.praise], ['话量', d.verbosity],
    ['抽象', d.abstract], ['语速', d.tempo], ['亲和', d.closeness], ['稳定', d.stability],
  ];
  return bands;
}

        ${state.teaching.filter((t) => t.label).map(toggleRow).join('')}
      </div>

        <button class="btn ghost" style="flex:1" data-reset>恢复中性</button>
        <button class="btn primary" style="flex:1" data-save>保存</button>
      </div>
    </aside>
  </div>`;

  // bind
  state.dims.slice(0, 6).forEach((d) =>
    bindSlider(root, d.key, (k, v) => {
      const t = state.dims.find((x) => x.key === k);
      if (t) t.value = v;
    })
  );
  root.querySelectorAll('[data-toggle]').forEach((row) => {
    const input = row.querySelector('[data-switch]');
    input.addEventListener('change', () => {
      const t = state.teaching.find((x) => x.key === row.dataset.toggle);
      if (t) t.on = input.checked;
    });
  });

  const input = root.querySelector('[data-input]');
  input.addEventListener('input', () => (state.input = input.value));
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') send();
  });

  function send(text) {
    const value = (text ?? state.input).trim();
    if (!value) return;
    state.messages.push({ role: 'me', text: value });
    if (state.step < INTERVIEW.length) {
      const tpl = inferTemplate(value);
      applyTemplate(tpl);
      state.answers.push(value);
      state.step += 1;
      if (state.step >= INTERVIEW.length) {
        state.messages.push({ role: 'ai', text: '都记下了。我按你说的塑造了一个角色，你可以继续微调。' });

    renderInterview(root);
  }

  root.querySelector('[data-send]').addEventListener('click', () => send());
  root.querySelectorAll('[data-chip]').forEach((b) =>

  );
  root.querySelector('[data-restart]')?.addEventListener('click', () => {
    state.step = 0;
    state.messages = [];
    state.answers = [];
    applyTemplate('senior');

  root.querySelector('[data-go-learn]')?.addEventListener('click', () => {
    state.mode = 'learn';

  });
  root.querySelector('[data-reset]').addEventListener('click', () => {
    state.dims.forEach((d) => (d.value = 50));
    renderInterview(root);
  });
  root.querySelector('[data-save]').addEventListener('click', () => {
    window.__toast?.(`「${state.name}」已保存`);
  });
}

/* ---------- harness wiring (from index.html) ---------- */

      /* ---------- toast host (shared by variants) ---------- */
      const toastHost = document.getElementById('toasts');
      window.__toast = (msg) => {
        const el = document.createElement('div');
        el.className = 'toast';
        el.textContent = msg;
        toastHost.appendChild(el);
        setTimeout(() => {
          el.style.transition = 'opacity 160ms ease, transform 160ms cubic-bezier(0.23,1,0.32,1)';
          el.style.opacity = '0';
          el.style.transform = 'translateY(4px) scale(0.98)';
          setTimeout(() => el.remove(), 180);
        }, 2000);
      };

      /* ---------- variant registry ---------- */
      const stage = document.getElementById('stage');
      const variants = [VariantStudio.mount, VariantWizard.mount, VariantCompanion.mount];

      // remove injected <style> blocks between mounts so variants don't fight
      const injected = [];
      const origAppend = document.head.appendChild.bind(document.head);
      document.head.appendChild = (node) => {
        if (node.tagName === 'STYLE' && node.textContent && !node.dataset.harness) {
          node.dataset.harness = 'variant';
          injected.push(node);
        }
        return origAppend(node);
      };

      function clearVariantStyles() {
        injected.forEach((n) => n.remove());
        injected.length = 0;
      }

      /* ---------- picker (behavior contract from PICKER.md) ---------- */
      const picker = document.querySelector('.proto-picker');
      const highlight = picker.querySelector('.proto-picker-highlight');
      const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
      const replay = picker.querySelector('.proto-picker-replay');
      let current = 0;

      function moveHighlight() {
        const el = items[current];
        highlight.style.width = el.offsetWidth + 'px';
        highlight.style.transform = `translateX(${el.offsetLeft}px)`;
      }

      function mount(i) {
        clearVariantStyles();
        stage.innerHTML = '';
        requestAnimationFrame(() => {
          variants[i](stage);
          moveHighlight();
        });
      }

      function setActive(i) {
        if (i < 0 || i >= variants.length) return;
        current = i;
        items.forEach((el, j) => {
          el.toggleAttribute('data-active', j === i);
          if (j === i) el.setAttribute('aria-current', 'true');
          else el.removeAttribute('aria-current');
        });
        moveHighlight();
        const url = new URL(location);
        url.searchParams.set('v', i + 1);
        history.replaceState(null, '', url);
        mount(i);
      }

      items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
      replay?.addEventListener('click', () => mount(current));
      window.addEventListener('resize', moveHighlight);

      document.addEventListener('keydown', (e) => {
        const t = e.target;
        if (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable) return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const num = parseInt(e.key, 10);
        if (num >= 1 && num <= variants.length) setActive(num - 1);
        else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
        else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
        else if (e.key === 'r' || e.key === 'R') mount(current);
      });

      setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
      requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
    

})();
